name: build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # Windows is Drift's target platform: this job is the first place the Windows-only code paths
    # (JNA bridges, tray, jpackage installer) can actually be exercised.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: .\mvnw.cmd -B verify
        shell: pwsh
      - name: Package installer (jpackage, WiX is preinstalled on the runner)
        run: .\scripts\package.ps1 -Type exe
        shell: pwsh
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: drift-windows-installer
          path: target/dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install display libraries for the JavaFX desktop tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgl1 libxtst6 libasound2t64
      - name: Build and test (with a virtual display)
        run: xvfb-run -a ./mvnw -B verify
